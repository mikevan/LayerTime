; LayerWand: the LILYGO T-Dongle-C5 (Slice 1). Its own pioarduino project,
; opened from this folder, like devices/lilygo-s3plus. It compiles only the
; repository's src/core/ and this folder's src/.
;
; The platform is pinned to pioarduino 55.03.311 (Arduino core 3.3.11,
; ESP-IDF 5.5.5): the first release that carries the ESP32-C5 BLE heap fix
; (espressif/arduino-esp32#12821). Libraries come from git tags so the build
; is reproducible. Moved here from the root platformio.ini in layout step 2
; (2026-10-02), unchanged apart from the paths.

[platformio]
default_envs = tdongle_c5_wand
workspace_dir = bin
src_dir = ../..
boards_dir = boards

; The LayerTime Node release firmware (Slice 1 Increment 1).
[env:tdongle_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = lilygo-t-dongle-c5
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<src/core/>
    +<devices/lilygo-layerwand/src/>
build_flags =
    -D LAYERTIME_TARGET_TDONGLE_C5
    -I ../../src
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0
    -D LV_CONF_SKIP
    -D LV_USE_ST7735=1
    -D LV_FONT_MONTSERRAT_12=1
extra_scripts =
    pre:../../tools/sensors_check.py
lib_deps =
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.1
    https://github.com/lvgl/lvgl.git#v9.4.0
    ; LayerTime-Sensors, the detector library: the submodule at sensors/,
    ; at the one revision LayerTime records (tools/sensors_check.py).
    symlink://${PROJECT_DIR}/../../sensors

; Test build of the C5 firmware for the Slice 1 measurements: adds the Probe
; characteristic (contracts/link.md) that the BOOT button drives through 20, 21,
; 64 and 180-byte notifications. Release firmware is the tdongle_c5 environment.
[env:tdongle_c5_test]
extends = env:tdongle_c5
build_flags =
    ${env:tdongle_c5.build_flags}
    -D LAYERTIME_LINK_TEST

; Slice 1 Increment 2A: the Recon no-link baseline. Runs the real Recon
; pipeline (core ReconScheduler, C5ReconRadio, the core classifiers,
; LayerTimeCore) on the C5's radios with the LayerTime Link not started, and
; keeps stage timestamps in PSRAM for the USB serial dump. Release firmware
; is still the tdongle_c5 environment.
[env:tdongle_c5_recon]
extends = env:tdongle_c5
build_flags =
    ${env:tdongle_c5.build_flags}
    -D LAYERTIME_RECON_BASELINE

; Slice 1 Increment 2B and after: the LayerWand. Real Recon (as in
; tdongle_c5_recon) and the LayerTime Link (as in tdongle_c5) on one C5:
; C5App.cpp answers the watch's COMMAND, GET_CHANGED and GET_TEXT requests
; through core's LinkServer and keeps Recon running with or without a watch.
[env:tdongle_c5_wand]
extends = env:tdongle_c5
build_flags =
    ${env:tdongle_c5.build_flags}
    -D LAYERTIME_WAND_APP
