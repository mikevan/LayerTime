; LayerTime on the LilyGo T-Watch Ultra, a LayerTime watch product. Its
; own pioarduino project, opened from this folder like devices/lilygo-s3plus
; and devices/lilygo-layerwand. It compiles only the repository's src/core/
; and this folder's src/.
;
; Moved here from the root platformio.ini in layout step 4 (2026-10-07),
; unchanged apart from the paths. The LilyGo template environments
; (twatchs3, tlora_pager, and the emulators) and the template's example list
; were removed.
;
; Every library is pinned (layout step 4). The first build after the move
; fetched LilyGoLib master (0.3.0, commit 0015b6a), which does not compile on
; this platform: it needs SensorLib 0.5.0 (ImuDrv.hpp) and ESP-IDF 5.5.3 or
; later (i2s_chan_info_t.is_enabled), while this target stays on Arduino core
; 3.3.6 (ESP-IDF 5.5.2) because 3.3.7 and later fail its BLE hardware gate
; (arduino-esp32 #12357). The pins are the exact versions the last known-good
; build (5773167, 2026-10-03) compiled with. Moving to a newer core is its own
; piece of work, shared with the S3 Plus, which pins the same LilyGoLib commit.

[platformio]
default_envs = twatch_ultra
workspace_dir = bin
src_dir = ../..
boards_dir = boards

[env_arduino]
framework = arduino
; T-Ultra platform: pioarduino 55.03.36-1 (Arduino core 3.3.6, ESP-IDF 5.5.2), carried
; in this repository with one bootstrap patch so it can share the PlatformIO Core
; with the T-Dongle-C5 environment. See tools/pioarduino-platform-55.03.36-1-lt1/LAYERTIME-PATCH.md.
; Newer cores (3.3.7+) fail the T-Ultra BLE hardware gate (arduino-esp32 #12357).
platform = symlink://${PROJECT_DIR}/tools/pioarduino-platform-55.03.36-1-lt1
upload_speed =  921600
monitor_speed = 115200
board_build.filesystem = fatfs
board_build.partitions =${platformio.libdeps_dir}/${platformio.default_envs}/LilyGoLib/examples/factory/partitions.csv
build_flags =
    -D CORE_DEBUG_LEVEL=0

    ; -U ARDUINO_USB_CDC_ON_BOOT        ; Disable Serial output

    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    ; -D RADIOLIB_EXCLUDE_CC1101
    ; -D RADIOLIB_EXCLUDE_SI443X
    ; -D RADIOLIB_EXCLUDE_SX128X
    ; -D RADIOLIB_EXCLUDE_NRF24
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    ; -D RADIOLIB_EXCLUDE_STM32WLX
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
    -Wnarrowing

    -D ARDUINO_LILYGO_LORA_SX1262   ; Used SX1262 LoRa
    ; -D ARDUINO_LILYGO_LORA_CC1101 ; Used CC1101 LoRa
    ; -D ARDUINO_LILYGO_LORA_SX1280 ; Used SX1280 LoRa
    ; -D ARDUINO_LILYGO_LORA_LR1121 ; Used LR1121 LoRa
    ; -D ARDUINO_LILYGO_LORA_SI4432 ; Used SI4432 LoRa

monitor_filters =
	default
	esp32_exception_decoder

lib_deps = 
    https://github.com/Xinyuan-LilyGO/LilyGoLib.git#38e6f8dee3ba78b340512af9a013365ef248a7d0
    lvgl/lvgl @ 9.4.0
    jgromes/RadioLib @ 7.4.0
    lewisxhe/XPowersLib @ 0.3.3
    lewisxhe/SensorLib @ 0.3.3
    mikalhart/TinyGPSPlus @ 1.1.0
    earlephilhower/ESP8266Audio @ 2.0.0
    h2zero/NimBLE-Arduino @ 2.2.3
    https://github.com/orlp/ed25519.git#b1f19fab4aebe607805620d25a5e42566ce46a0e


[env:twatch_ultra]
extends = env_arduino
board = lilygo-t-watch-ultra
; Link each library as a static archive (.a), as every T-Ultra build has.
; The pioarduino platform turns archiving off (builder/main.py) unless
; lib_archive appears somewhere in this file; the old root platformio.ini
; mentioned it only for the removed emulator environments, which kept
; archiving on here. Without archives, the project's lib/libhelix-mp3 and
; the copy inside ESP8266Audio are both linked whole and collide.
lib_archive = yes
extra_scripts =
    pre:tools/tultra_lvgl_thorvg_patch.py
build_src_filter =
    -<*>
    +<src/core/>
    +<devices/lilygo-tultra/src/>
build_flags =     
    ${env_arduino.build_flags}
    -I ../../src
    -I variants/lilygo_twatch_ultra
    -D ARDUINO_T_WATCH_S3_ULTRA
    ; LVGL configuration owned by this target, including the vector and SVG
    ; settings for the embedded owl (see lv_conf_tultra.h for why).
    -D LV_CONF_PATH=\"lv_conf_tultra.h\"
    -I .
lib_deps =     
    ${env_arduino.lib_deps}
    https://github.com/lewisxhe/ST25R3916-fork.git#0c8e00f49d12881d1cff6d6f0879b90ce7ed4033
    https://github.com/lewisxhe/NFC-RFAL-fork.git#7bde4587ea44c36c178a43d083d7a7345c1e4cfe
