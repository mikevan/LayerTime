; LayerTime GPS / sensor diagnostic firmware.
;
; TEMPORARY. This replaces LayerTime on the watch. Reflash LayerTime when done.
;
; Self-contained: modifies nothing in the parent project. Board and variant
; are borrowed from the repo root, so this stays in step with the real build.
;
; Build and flash from VS Code, not the command line:
;   File > Add Folder to Workspace... > tools\gpsdiag
;   PlatformIO sidebar > gpsdiag > env:twatch_ultra_diag > General > Upload
;   then Monitor. It logs itself to platformio-device-monitor-*.log in this folder.
;
[platformio]
default_envs = twatch_ultra_diag
boards_dir = ../../boards

[env:twatch_ultra_diag]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = lilygo-t-watch-ultra
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = fatfs
board_build.partitions = ${platformio.libdeps_dir}/${platformio.default_envs}/LilyGoLib/examples/factory/partitions.csv

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -I ../../variants/lilygo_twatch_ultra
    -D ARDUINO_T_WATCH_S3_ULTRA
    -D ARDUINO_LILYGO_LORA_SX1262
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
    -Wnarrowing

monitor_filters =
    default
    time                      ; wall-clock timestamp on every line
    log2file                  ; writes platformio-device-monitor-*.log beside this file
    esp32_exception_decoder

; ESP8266Audio and ed25519 are DELIBERATELY absent. ESP8266Audio uses the
; legacy ESP-IDF I2S driver, the Arduino core uses the new one, and ESP-IDF
; abort()s at boot when both are linked. That was a boot loop inside
; LilyGoLib's begin(), 2026-09-05. A GPS diagnostic needs no audio.
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGoLib
    lvgl/lvgl @ 9.4.0
    jgromes/RadioLib @ 7.4.0
    lewisxhe/XPowersLib @ 0.3.3
    lewisxhe/SensorLib @ 0.3.3
    mikalhart/TinyGPSPlus @ ^1.0.3
    h2zero/NimBLE-Arduino @ 2.2.3
    https://github.com/lewisxhe/ST25R3916-fork.git
    https://github.com/lewisxhe/NFC-RFAL-fork.git
