; LayerTime on the LilyGo T-Watch S3 Plus (SX1262), the all-in-one target.
;
; Open THIS folder (devices/lilygo-s3plus/) in VS Code, the same way devices/garmin-tactix/ is opened. It is
; its own pioarduino project, separate from the repository root, which is the
; T-Watch Ultra and T-Dongle-C5 project. Nothing here is read by the root
; platformio.ini, and the Ultra build (everything under ../../src/) never sees
; devices/lilygo-s3plus/.
;
; Isolation, all set here so it holds for the IDE and the command line alike:
;   core_dir      Platforms, packages, the Python environment, and the cache
;                 live in ~/.platformio-s3plus, never in the shared
;                 ~/.platformio the Ultra and the C5 use. A PLATFORMIO_CORE_DIR
;                 environment variable would override this, so
;                 tools/s3plus_core_dir_check.py stops any build that is not
;                 running in ~/.platformio-s3plus.
;   workspace_dir Build output and libraries go to devices/lilygo-s3plus/bin/, like devices/garmin-tactix/bin/.
;   platform      A renamed copy of the Ultra's lt1 platform (pioarduino
;                 55.03.36-1, Arduino core 3.3.6), so even a wrong core_dir
;                 could not re-point the Ultra's link record. See
;                 tools/pioarduino-platform-s3plus-55.03.36-1-lt1/S3PLUS-COPY.md.
;   src_dir       The repository root, filtered to ../../src/core/ (shared,
;                 hardware-independent, reused unchanged) and devices/lilygo-s3plus/src/.
;
; Other choices:
;   * LilyGoLib pinned to 38e6f8d, the commit the Ultra's library copy
;     matches. LilyGoLib master is 0.3.0 with a 2026-09-19 refactor.
;   * LVGL configuration owned by this target (lv_conf_s3plus.h).
;   * LVGL 9.4.0's bundled ThorVG needs <cstring> under this GCC 14 toolchain;
;     tools/s3plus_lvgl_thorvg_cstring.py force-includes it for every C++
;     compile of this target (see that file for why not per file). Downloaded
;     libraries are never edited.
;   * No ESP8266Audio: the S3 variant enables LilyGoLib's new-driver amplifier,
;     and ESP8266Audio's legacy I2S driver boot-loops beside it.
;   * Uploads go through tools/s3plus_upload_guard.py, which refuses any
;     board that is not a registered S3 Plus (tools/s3plus_register_mac.py).
;   * Mesh stays powered off and deferred.

[platformio]
default_envs = twatch_s3plus
core_dir = ~/.platformio-s3plus
workspace_dir = bin
src_dir = ../..
boards_dir = boards

[env:twatch_s3plus]
platform = symlink://${PROJECT_DIR}/tools/pioarduino-platform-s3plus-55.03.36-1-lt1
board = lilygo-t-watch-s3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
extra_scripts =
    pre:tools/s3plus_core_dir_check.py
    pre:tools/s3plus_lvgl_thorvg_cstring.py
    post:tools/s3plus_upload_guard.py
build_src_filter =
    -<*>
    +<src/core/>
    +<devices/lilygo-s3plus/src/>
build_flags =
    -D LAYERTIME_TARGET_TWATCH_S3PLUS
    -D ARDUINO_T_WATCH_S3
    -I ../../src
    -I variants/lilygo_twatch_s3
    -D LV_CONF_PATH=\"lv_conf_s3plus.h\"
    -I .
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_LILYGO_LORA_SX1262
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
    -Wnarrowing
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGoLib.git#38e6f8dee3ba78b340512af9a013365ef248a7d0
    lvgl/lvgl @ 9.4.0
    jgromes/RadioLib @ 7.4.0
    lewisxhe/XPowersLib @ 0.3.3
    lewisxhe/SensorLib @ 0.3.3
    mikalhart/TinyGPSPlus @ 1.1.0
    h2zero/NimBLE-Arduino @ 2.2.3
