name: LayerTime CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      product_ref:
        type: string
        default: main
      candidate_repository:
        type: string
        default: ''
      candidate_revision:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: LayerTime-${{ github.workflow }}-${{ github.ref }}-${{ inputs.candidate_repository }}
  cancel-in-progress: true
jobs:
  host:
    name: Watch host checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mikevan/LayerTime
          ref: ${{ inputs.product_ref || github.ref }}
          path: product
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch candidate staging tool
        if: inputs.candidate_repository != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mikevan/LayerTime
          ref: main
          path: ci-tools
          sparse-checkout: tools/ci/test_dependency_candidate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage shared-library candidate in this temporary checkout
        if: inputs.candidate_repository != ''
        env:
          PRODUCT_ROOT: ${{ github.workspace }}/product
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
        run: python ci-tools/tools/ci/test_dependency_candidate.py
      - name: Run host gate
        run: |
          set -o pipefail
          cd product
          bash tools/ci/preflight.sh --host 2>&1 | tee host.log
      - name: Save build results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layertime-host-${{ github.run_id }}-${{ inputs.candidate_repository || 'pinned' }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            product/host.log
            product/tools/ci/logs/
            product/candidate-validation.json
  firmware:
    name: Watch firmware (${{ matrix.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: twatch_ultra
            directory: lilygo-tultra
          - target: twatch_s3plus
            directory: lilygo-s3plus
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mikevan/LayerTime
          ref: ${{ inputs.product_ref || github.ref }}
          path: product
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch candidate staging tool
        if: inputs.candidate_repository != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mikevan/LayerTime
          ref: main
          path: ci-tools
          sparse-checkout: tools/ci/test_dependency_candidate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage shared-library candidate in this temporary checkout
        if: inputs.candidate_repository != ''
        env:
          PRODUCT_ROOT: ${{ github.workspace }}/product
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
        run: python ci-tools/tools/ci/test_dependency_candidate.py
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build watch firmware
        env:
          DEVICE_DIRECTORY: ${{ matrix.directory }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          cd product
          pio run -d "devices/$DEVICE_DIRECTORY" -e "$BUILD_TARGET" -j 2 2>&1 | tee firmware.log
      - name: Save build results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layertime-${{ matrix.target }}-${{ github.run_id }}-${{ inputs.candidate_repository || 'pinned' }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            product/firmware.log
            product/devices/*/bin/build/*/firmware.bin
            product/devices/*/bin/build/*/firmware.elf
            product/devices/*/bin/build/*/bootloader.bin
            product/devices/*/bin/build/*/partitions.bin
            product/candidate-validation.json
